[workspace]
resolver = "2"
members = ["crates/rl-core", "crates/rl-cli", "crates/rl-app", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23"
boxcars = "0.12"
chrono = "0.4"
futures-util = "0.3"
getrandom = "0.4"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rust-embed = "8"
subtle = "2"
subtr-actor = "=1.4.0"
sysinfo = "0.39"
tempfile = "3"
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56"
anyhow = "1"
ts-rs = "12.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

# The replay parsers are slow unoptimized (a 5-minute match takes over a minute in tests).
[profile.dev.package.boxcars]
opt-level = 3

[profile.dev.package.subtr-actor]
opt-level = 3
